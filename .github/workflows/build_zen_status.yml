name: Build zen-status.exe

# Builds tools/ai-status/zen-status.exe and, on pushes to v4.2-draft / main / master, commits it
# back to the branch so the one-key deploy package always ships a prebuilt exe.
# No loop: the commit only touches tools/ai-status/zen-status.exe (outside the paths filter),
# carries [skip ci], and pushes made with GITHUB_TOKEN do not trigger workflows anyway.
# The build is reproducible (-Wl,--no-insert-timestamp), so an unchanged source makes no commit.

on:
  push:
    branches:
      - master
      - main
      - v4.2-draft
    paths:
      - 'tools/ai-status/zen-status/**'
      - '.github/workflows/build_zen_status.yml'
  pull_request:
    paths:
      - 'tools/ai-status/zen-status/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zen-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - name: Build (no CRT, kernel32 + shell32 only)
        run: |
          CC=x86_64-w64-mingw32-gcc OUT=../zen-status.exe sh tools/ai-status/zen-status/build.sh
          x86_64-w64-mingw32-objdump -p tools/ai-status/zen-status.exe | grep 'DLL Name'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-status
          path: tools/ai-status/zen-status.exe

      - name: Commit prebuilt exe back to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'Liset999'
          git config user.email '218059571+Liset999@users.noreply.github.com'
          export GIT_AUTHOR_NAME='Liset999' GIT_COMMITTER_NAME='Liset999'
          export GIT_AUTHOR_EMAIL='218059571+Liset999@users.noreply.github.com' GIT_COMMITTER_EMAIL='218059571+Liset999@users.noreply.github.com'
          git add -f tools/ai-status/zen-status.exe
          if git diff --cached --quiet; then
            echo 'zen-status.exe unchanged, nothing to commit'
            exit 0
          fi
          git commit -m 'zen-status.exe: rebuild prebuilt binary [skip ci]'
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" tools/ai-status/zen-status.exe --clobber
