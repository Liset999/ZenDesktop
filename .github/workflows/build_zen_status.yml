name: Build zen-status.exe

on:
  push:
    branches:
      - master
      - main
      - v4.2-draft
    paths:
      - 'tools/ai-status/zen-status/**'
      - '.github/workflows/build_zen_status.yml'
  pull_request:
    paths:
      - 'tools/ai-status/zen-status/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - name: Build (no CRT, kernel32 + shell32 only)
        run: |
          CC=x86_64-w64-mingw32-gcc sh tools/ai-status/zen-status/build.sh
          x86_64-w64-mingw32-objdump -p tools/ai-status/zen-status/zen-status.exe | grep 'DLL Name'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-status
          path: tools/ai-status/zen-status/zen-status.exe

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" tools/ai-status/zen-status/zen-status.exe --clobber
